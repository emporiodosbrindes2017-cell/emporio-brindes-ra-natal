
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste A-Frame - Transparência Papai Noel</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-transparent-video-shader@1.0.6/dist/aframe-transparent-video-shader.umd.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #00cc44;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <a-scene embedded
    background="color: #00cc44"
    renderer="alpha: true; colorManagement: true">

    <a-assets>
      <video
        id="santaVideo"
        src="./assets/papai_noel_transparente_v2.webm"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0"
      look-controls="enabled: false"></a-camera>

    <a-entity
      geometry="primitive: plane; width: 0.45; height: 0.3375"
      material="shader: transparent-video; src: #santaVideo; side: double"
      position="0 0 -1">
    </a-entity>

  </a-scene>
</body>
</html>
